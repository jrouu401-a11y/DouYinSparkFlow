name: DouYin Spark Flow Schedule Run
on:
  workflow_dispatch:
    inputs:
      force:
        description: Run even if a successful run already exists today
        required: false
        default: false
        type: boolean
      only_targets:
        description: Optional exact target IDs separated by commas; blank uses all configured targets
        required: false
        default: ''
        type: string
# 自动定时将在一次人工运行获得全部“已确认发送”结果后恢复。
# 目前仅保留 workflow_dispatch，避免失效登录态导致每日无效运行。
jobs:
  run-main:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: user-data
    permissions:
      actions: read
      contents: read
    concurrency:
      group: douyin-spark-flow
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Test Douyin Accessibility
      run: |
        curl -I https://creator.douyin.com/
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run unit tests
      run: python -m unittest discover -s tests
    - name: Prevent duplicate daily runs
      id: daily-guard
      env:
        FORCE_RUN: ${{ inputs.force || 'false' }}
        GITHUB_TOKEN: ${{ github.token }}
        WORKFLOW_FILE: schedule.yml
      run: python utils/daily_guard.py
    - name: Ensure browsers are installed
      if: steps.daily-guard.outputs.should_run == 'true'
      run: playwright install chromium --with-deps --only-shell
    - name: Export Github Environment Variables and Secrets to JSON
      if: steps.daily-guard.outputs.should_run == 'true'
      env:
        VARS_JSON: ${{ toJson(vars) }}
        SECRETS_JSON: ${{ toJson(secrets) }}
      run: python utils/export_github_env.py
    - name: Run DouYin Spark Flow
      if: steps.daily-guard.outputs.should_run == 'true'
      env:
        ONLY_TARGETS: ${{ inputs.only_targets || '' }}
      run: python main.py
    - name: Partial target selection
      if: ${{ always() && inputs.only_targets != '' }}
      run: echo "This validation covers a subset, not the full daily delivery."
    - uses: actions/upload-artifact@v6
      if: ${{ !cancelled() && steps.daily-guard.outputs.should_run == 'true' }}
      with:
        name: run-logs
        path: logs/
