name: DouYin Spark Flow Schedule Run
on:
  workflow_dispatch:
    inputs:
      force:
        description: Run even if a successful run already exists today
        required: false
        default: false
        type: boolean
  schedule: # 定时任务
    - cron: "0 1 * * *" # 每天 1:00 UTC（北京时间 9:00）
    - cron: "30 1 * * *" # 09:30 UTC+8 补偿重试，成功运行会被去重保护拦截
    - cron: "0 2 * * *" # 10:00 UTC+8 补偿重试，成功运行会被去重保护拦截
jobs:
  run-main:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: user-data
    permissions:
      actions: read
      contents: read
    concurrency:
      group: douyin-spark-flow
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Test Douyin Accessibility
      run: |
        curl -I https://creator.douyin.com/
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run unit tests
      run: python -m unittest discover -s tests
    - name: Prevent duplicate daily runs
      id: daily-guard
      env:
        FORCE_RUN: ${{ inputs.force || 'false' }}
        GITHUB_TOKEN: ${{ github.token }}
        WORKFLOW_FILE: schedule.yml
      run: python utils/daily_guard.py
    - name: Ensure browsers are installed
      if: steps.daily-guard.outputs.should_run == 'true'
      run: playwright install chromium --with-deps --only-shell
    - name: Export Github Environment Variables and Secrets to JSON
      if: steps.daily-guard.outputs.should_run == 'true'
      env:
        VARS_JSON: ${{ toJson(vars) }}
        SECRETS_JSON: ${{ toJson(secrets) }}
      run: python utils/export_github_env.py
    - name: Run DouYin Spark Flow
      if: steps.daily-guard.outputs.should_run == 'true'
      run: python main.py
    - uses: actions/upload-artifact@v6
      if: ${{ !cancelled() && steps.daily-guard.outputs.should_run == 'true' }}
      with:
        name: run-logs
        path: logs/
